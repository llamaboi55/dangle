[package]
name = "dangle"
version = "1.0.0"
description = "Little charms that hang from the top of your screen. Free and open source."
authors = ["Chipper-AOS"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dangle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
